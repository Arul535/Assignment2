<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Alert - Simulation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }

        /* YOUR UPLOADED TAMIL NADU POLICE WEBSITE IMAGE */
        .website-background {
            position: fixed;
            inset: 0;

            background-image: url("TNP HOME PAGE.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(7px);
            transform: scale(1.04);
        }

        /* Darkens the website slightly */
        .dark-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
        }

        /* Flashing red emergency effect */
        .red-flash {
            position: fixed;
            inset: 0;
            pointer-events: none;

            animation: redAlert 0.8s infinite;
        }

        @keyframes redAlert {
            0%, 100% {
                box-shadow: inset 0 0 0 rgba(255, 0, 0, 0);
            }

            50% {
                box-shadow: inset 0 0 160px rgba(255, 0, 0, 0.75);
            }
        }

        /* Popup */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 850px;
            max-width: 90%;

            background: rgba(10, 10, 10, 0.96);
            color: white;

            border: 4px solid red;
            border-radius: 10px;

            padding: 40px;

            text-align: center;

            box-shadow:
                0 0 25px red,
                0 0 70px rgba(255, 0, 0, 0.8);

            z-index: 10;
        }

        .warning {
            font-size: 22px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 20px;

            font-size: 50px;
            color: red;

            text-transform: uppercase;

            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.35;
            }
        }

        .message {
            font-size: 25px;
            line-height: 1.5;
        }

        .simulation {
            margin-top: 25px;
            padding: 15px;

            background: #222;
            border: 1px solid #777;

            font-size: 16px;
            color: #ffcc00;
        }

        button {
            margin-top: 25px;

            padding: 12px 30px;

            border: none;
            border-radius: 5px;

            background: white;
            color: black;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Actual Tamil Nadu Police website screenshot -->
    <div class="website-background"></div>

    <div class="dark-overlay"></div>

    <!-- Red flashing alarm -->
    <div class="red-flash"></div>

    <!-- Alert popup -->
    <div class="popup">

        <div class="warning">
            ⚠ ⚠ ⚠ SECURITY ALERT ⚠ ⚠ ⚠
        </div>

        <h1>WEBSITE HACKED</h1>

        <div class="message">
            <strong>TAMILNADU POLICE WEBSITE</strong>
            <br><br>
            SECURITY BREACH DETECTED
        </div>

        <div class="simulation">
            ⚠ CYBERSECURITY AWARENESS SIMULATION ⚠
            <br><br>
            This is a fictional demonstration.
            No real website has been compromised
            and no ransom payment should be made.
        </div>

        <button onclick="document.querySelector('.popup').style.display='none'">
            CLOSE
        </button>

    </div>

</body>
</html>
