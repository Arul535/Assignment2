<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tamilnadu Police Citizen Portal</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   LOGIN PAGE
   ===================================================== */

.login-page {

    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #eeeeee;
}


.login-box {

    width: 400px;
    max-width: 90%;

    padding: 40px;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.20);

    text-align: center;
}


/* LOGO */

.logo {

    width: 200px;
    height: 200px;

    margin: 0 auto 20px;

    display: flex;

    justify-content: center;
    align-items: center;
}


.logo img {

    width: 100%;
    height: 100%;

    object-fit: contain;
}


.login-box h1 {

    margin: 5px 0 8px;

    font-size: 28px;

    color: #222;
}


.login-box p {

    margin: 0 0 30px;

    color: #777;

    font-size: 15px;
}


/* INPUTS */

.input-group {

    text-align: left;

    margin-bottom: 20px;
}


.input-group label {

    display: block;

    margin-bottom: 7px;

    font-size: 14px;

    font-weight: bold;

    color: #333;
}


.input-group input {

    width: 100%;

    height: 46px;

    padding: 0 13px;

    border: 1px solid #bbb;

    border-radius: 6px;

    font-size: 16px;
}


.input-group input:focus {

    outline: none;

    border-color: #5b4bb7;

    box-shadow: 0 0 0 2px rgba(91,75,183,0.15);
}


/* LOGIN BUTTON */

.login-button {

    width: 100%;

    height: 48px;

    border: none;

    border-radius: 6px;

    background: #5b4bb7;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}


.login-button:hover {

    background: #48399d;
}


.demo-note {

    margin-top: 22px;

    font-size: 12px;

    color: #999;
}



/* =====================================================
   ALERT PAGE
   ===================================================== */

.alert-page {

    display: none;

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #000;
}


/* WEBSITE SCREENSHOT */

.website-background {

    position: absolute;

    inset: -20px;

    background-image: url("TNP HOME PAGE(1).jpg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    filter: blur(9px);
}


/* DARKEN SCREEN */

.dark-overlay {

    position: absolute;

    inset: 0;

    background: rgba(0,0,0,0.48);
}


/* =====================================================
   RED FLASH
   ===================================================== */

.red-alert {

    position: absolute;

    inset: 0;

    pointer-events: none;

    animation: redFlash 0.65s infinite;
}


@keyframes redFlash {

    0% {

        box-shadow:
            inset 0 0 20px rgba(255,0,0,0.10);
    }

    50% {

        box-shadow:
            inset 0 0 130px rgba(255,0,0,0.85),
            inset 0 0 280px rgba(255,0,0,0.45);
    }

    100% {

        box-shadow:
            inset 0 0 20px rgba(255,0,0,0.10);
    }
}



/* =====================================================
   ALERT WINDOW
   ===================================================== */

.alert-box {

    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 850px;

    max-width: 90%;

    padding: 45px;

    background: rgba(0,0,0,0.94);

    border: 5px solid red;

    border-radius: 12px;

    text-align: center;

    color: white;

    box-shadow:
        0 0 30px red,
        0 0 80px rgba(255,0,0,0.75);
}


/* WARNING SYMBOL */

.warning-symbol {

    font-size: 30px;

    margin-bottom: 10px;

    color: red;
}


/* MAIN MESSAGE */

.alert-box h2 {

    margin: 10px 0;

    font-size: clamp(38px, 6vw, 70px);

    font-weight: 900;

    color: red;

    text-transform: uppercase;

    text-shadow:
        0 0 10px red,
        0 0 25px red;

    animation: messageFlash 0.65s infinite;
}


@keyframes messageFlash {

    0%,
    100% {

        opacity: 1;
    }

    50% {

        opacity: 0.20;
    }
}


/* TECHNOCOP */

.technocop {

    margin-top: 15px;

    font-size: clamp(28px, 4vw, 48px);

    font-weight: 900;

    color: red;

    letter-spacing: 3px;

    text-transform: uppercase;

    animation: messageFlash 0.65s infinite;
}


/* DEMO IDENTIFICATION */

.demo-label {

    margin-top: 30px;

    padding: 12px 20px;

    border: 1px solid #ffcc00;

    color: #ffcc00;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 2px;
}

</style>
</head>


<body>


<!-- ==================================================
     LOGIN SCREEN
     ================================================== -->

<div class="login-page" id="loginPage">

    <div class="login-box">


        <!-- YOUR GITHUB LOGO -->
        <div class="logo">

                <img src="https://www.clipartmax.com/png/middle/232-2326236_tamilnadu-police-logo-png.png" alt="Tamilnadu Police Logo Png@clipartmax.com">
                
            >

        </div>


        <h1>Tamilnadu Police Citizen Portal</h1>

        <p>Authorized Login</p>


        <form id="loginForm">


            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="off"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="off"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button">

                LOGIN

            </button>


        </form>


        <div class="demo-note">

            Cybersecurity awareness demonstration

        </div>


    </div>

</div>



<!-- ==================================================
     ALERT SCREEN
     ================================================== -->

<div class="alert-page" id="alertPage">


    <!-- YOUR UPLOADED WEBSITE SCREENSHOT -->

    <div class="website-background"></div>


    <!-- DARK OVERLAY -->

    <div class="dark-overlay"></div>


    <!-- FLASHING RED EFFECT -->

    <div class="red-alert"></div>


    <!-- ALERT MESSAGE -->

    <div class="alert-box">


        <div class="warning-symbol">

            ⚠ ⚠ ⚠

        </div>


        <h2>

            WEBSITE HACKED

        </h2>


        <div class="technocop">

            BY TECHNOCOP

        </div>


        <div class="demo-label">

            CYBERSECURITY AWARENESS DEMONSTRATION

        </div>


    </div>


</div>



<script>


/*
==========================================================
LOGIN ACTION
==========================================================

The entered username/password are NOT stored,
sent to a server, or transmitted anywhere.
==========================================================
*/


document
.getElementById("loginForm")
.addEventListener("submit", function(event) {


    event.preventDefault();


    /* Hide login */

    document
    .getElementById("loginPage")
    .style.display = "none";


    /* Show alert */

    document
    .getElementById("alertPage")
    .style.display = "block";


});


</script>


</body>
</html>
